apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: incidentremediations.sentinel.sre.io
spec:
  group: sentinel.sre.io
  names:
    kind: IncidentRemediation
    listKind: IncidentRemediationList
    plural: incidentremediations
    singular: incidentremediation
    shortNames:
    - incident
    - incidents
    - inc
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Severity
      type: string
      jsonPath: .spec.severity
    - name: Workload
      type: string
      jsonPath: .spec.targetWorkload
    - name: Root Cause
      type: string
      jsonPath: .spec.rootCauseClass
    - name: Approval
      type: string
      jsonPath: .spec.approvalStatus
    - name: MTTR
      type: string
      jsonPath: .spec.mttrSeconds
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - incidentId
            - targetWorkload
            - rootCauseClass
            - approvalStatus
            properties:
              incidentId:
                type: string
              severity:
                type: string
                enum: ["SEV-1", "SEV-2", "SEV-3", "SEV-4"]
              targetWorkload:
                type: string
              rootCauseClass:
                type: string
              smokingGun:
                type: string
              proposedPatch:
                type: string
              approvalStatus:
                type: string
                enum: ["PendingApproval", "Approved", "Rejected", "Applied"]
              mttrSeconds:
                type: string
          status:
            type: object
            properties:
              phase:
                type: string
                enum: ["Detected", "Triaged", "Remediating", "Remediated", "Failed"]
              remediatedAt:
                type: string
              observedGeneration:
                type: integer
